[pytest]
pythonpath = .
testpaths = tests
addopts = -p src.testing.plan_e_protected_output_guard
markers =
    cleanup_current: current cleanup-family tests that validate the present repository state under the supported collaborator runtime
    cleanup_historical: cleanup-family tests retained as historical phase snapshots, including exact historical runtime assertions
    phase_snapshot: tests whose assertions represent a specific phase snapshot and may preserve superseded runtime paths or archived artifact layouts
    superseded_invariant: historical assertions intentionally superseded by an authorized later phase
    migration_regression: current regression coverage for approved archive migration contracts
    refactor_regression: current regression coverage for approved refactor contracts
    manual_offline: intentionally runnable offline/manual validation tests outside the default current cleanup suite
    unsafe_external: tests that may require external services, training, inference, downloads, or other unsafe side effects
