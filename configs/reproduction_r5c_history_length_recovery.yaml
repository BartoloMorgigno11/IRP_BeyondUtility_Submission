project_root: .

experiment:
  name: reproduction_r5c_history_length_recovery
  identity: R5C_HISTORY_LENGTH
  allow_paid_or_external_api_calls: false
  allow_downloads: false
  allow_training: false
  allow_canddif_recovery: false
  allow_generation_recovery: false
  allow_local_ollama_execution: true

frozen_r5a:
  freeze_commit: 98c28c5364c40e571765a3b50d4dab8affe80743
  manifest: results/tables/reproduction_r5a_recovery_request_manifest.csv
  manifest_sha256: 290CCB9E809FF7BDAECDF83AE9C2AC9DF79A3715B6FC9CC14E520521001E0AFD
  manifest_rows: 4800

frozen_r5b_corrected:
  freeze_commit: 83b46454866ea61f3e05eec81d555be53e4c41e8
  freeze_manifest: results/manifests/reproduction_r5b_corrected_freeze.json
  protocol_hash: 9596F36E1B1DBC15B68679DDF32114E6AE09914B418FB31DC112072384B708D5
  raw_namespace: results/recovery/r5b_corrected

scope:
  recovery_family: HISTORY_LENGTH_RECOVERY
  selected_rows: 2400
  expected_groups: 800
  expected_cells: 24
  expected_k: 5
  datasets:
    - Beauty
    - Sports
    - ML-1M
    - LastFM
  models:
    - qwen2:7b-instruct
    - mistral:7b-instruct
  conditions_by_dataset:
    Beauty:
      - HISTORY_LENGTH_0
      - HISTORY_LENGTH_10
      - HISTORY_LENGTH_20
    Sports:
      - HISTORY_LENGTH_5
      - HISTORY_LENGTH_10
      - HISTORY_LENGTH_20
    ML-1M:
      - HISTORY_LENGTH_5
      - HISTORY_LENGTH_10
      - HISTORY_LENGTH_20
    LastFM:
      - HISTORY_LENGTH_5
      - HISTORY_LENGTH_10
      - HISTORY_LENGTH_20
  forbidden_recovery_families:
    - CANDDIF_RECOVERY
    - GENERATION_INVOLVED_RECOVERY
  forbidden_tasks:
    - profile_generation

runtime:
  backend: ollama
  endpoint: http://127.0.0.1:11434/api/generate
  tags_endpoint: http://127.0.0.1:11434/api/tags
  version_endpoint: http://127.0.0.1:11434/api/version
  timeout_seconds: 120
  temperature: 0
  max_retries: 0
  stream: false
  format: json
  disk_free_min_bytes: 1073741824
  assumed_context_length: 32768
  min_context_margin_tokens: 1024

gates:
  canary_initial_per_cell: 1
  early_additional_per_cell: 2
  periodic_accounted_checkpoints:
    - 240
    - 600
    - 1200
    - 1800
  min_overall_validity_rate: 0.75
  min_model_validity_rate: 0.65
  max_overall_wrong_length_rate: 0.20
  max_cell_wrong_length_rate: 0.50

outputs:
  table_dir: results/tables
  diagnostics_dir: results/diagnostics/r5c_history_length
  report: report/reproduction_r5c_history_length_recovery.md
  result_namespace: results/recovery/r5c_history_length
  request_execution_status: results/tables/reproduction_r5c_history_length_request_execution_status.csv
  execution_manifest: results/tables/reproduction_r5c_history_length_execution_manifest.csv
  group_validation: results/tables/reproduction_r5c_history_length_group_validation.csv
  output_validity: results/tables/reproduction_r5c_history_length_output_validity.csv
  metrics_by_condition: results/tables/reproduction_r5c_history_length_metrics_by_condition.csv
  history_length_results: results/tables/reproduction_r5c_history_length_results.csv
  conditional_valid_metrics: results/tables/reproduction_r5c_history_length_conditional_valid_metrics.csv
  dataset_model_summary: results/tables/reproduction_r5c_history_length_dataset_model_summary.csv
  official_comparison: results/tables/reproduction_r5c_history_length_official_comparison.csv
  gap_resolution: results/tables/reproduction_r5c_history_length_gap_resolution.csv
  runtime_provenance: results/tables/reproduction_r5c_history_length_runtime_provenance.csv
  validation: results/tables/reproduction_r5c_history_length_validation.csv
