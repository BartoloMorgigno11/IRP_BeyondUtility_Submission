phase_id: phase_f6l
phase_name: phase_f6l_paper_faithful_completion_and_rq_revalidation
decision_token: f6l_execution_matrix_partially_blocked_by_missing_official_artifacts
previous_checkpoint_token: f6l_paper_faithful_execution_checkpoint_ready

runtime:
  python: .venv_audit_recovery/Scripts/python.exe
  python_no_user_site: "1"
  python_dont_write_bytecode: "1"
  cleanup_gate_result: "159 passed, 1698 deselected"
  runtime_classification: defensible_repaired_clone_exact_package_versions

policy:
  default_mode: audit-checkpoint
  no_inference_before_checkpoint: true
  no_paid_api: true
  no_original_repo_modification: true
  no_raw_output_overwrite: true
  no_git_stage_or_commit: true
  official_free_downloads_allowed: true
  official_download_destinations:
    - data/external/phase_f6l/
    - results/external/phase_f6l/
  evidence_classifications:
    - exact_original_artifact_reproduction
    - paper_protocol_reproduction_new_stochastic_output
    - paper_protocol_reproduction_different_open_model
    - paper_protocol_reproduction_new_sample
    - adapted_protocol_reproduction
    - original_project_extension
    - blocked_missing_original_specification
    - blocked_paid_or_unavailable_model
    - non_comparable

authoritative_sources:
  - paper/2411.00331v1.pdf
  - original_repo/EvaLLMasRecommender
  - https://github.com/JiangDeccc/EvaLLMasRecommender
  - original_repo/EvaLLMasRecommender/llm_results/beauty.zip
  - original_repo/EvaLLMasRecommender/llm_results/sports.zip
  - original_repo/EvaLLMasRecommender/sota_results/beauty_his10.zip
  - results/tables/phase_f6j_research_question_evidence_matrix.csv
  - results/tables/phase_f6k_scientific_gap_readiness.csv

lastfm_paper_target:
  dataset: LastFM
  filtering: 5-core
  split: leave-one-out
  sample_users: 1000
  sample_validation: Kolmogorov-Smirnov gate against eligible test population
  ranking_candidate_pool:
    positive_items: 1
    negative_items: 19
    candidate_count: 20
    candidate_order: shared across LLMs
    requested_output_count: 10
  reranking_candidate_pool:
    source_models:
      - BPRMF
      - GRU4Rec
      - SASRec
      - LightGCN
    candidate_count: 20
    candidate_order: preserved and shared across LLMs
    requested_output_count: 10
  metrics:
    utility:
      - HR@5
      - NDCG@5
    beyond_utility:
      - APLT
      - popularity
      - serendipity
      - validity
      - hallucination

local_open_models:
  - model_family: Qwen2 7B Instruct
    local_identifier: qwen2:7b-instruct
    paper_model_identifier: qwen-2-7b-instruct
    execution_classification: paper_protocol_reproduction_different_open_model
  - model_family: Mistral 7B Instruct
    local_identifier: mistral:7b-instruct
    paper_model_identifier: mistral-7b-instruct-v0.2
    execution_classification: paper_protocol_reproduction_different_open_model

closed_or_paid_models:
  - GPT-3.5
  - GPT-4
  - GPT-4o-mini
  - GPT-4o
  - Claude3
  - GLM4
  - Llama3-70B-Instruct

