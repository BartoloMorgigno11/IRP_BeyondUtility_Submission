  - name: sports
    display_name: Amazon Sports
    cohort_id: sports_primary_892
    evaluation_users: 892
    candidate_source: results/tables/plan_e_sports_1000user_ranking_manifest.csv
    cohort_filter_source: results/tables/canonical_llm_cohort_preflight.csv
    interaction_source: data/reconstructed/plan_c/amazon_sports/interactions.csv
    catalog_source: data/reconstructed/plan_c/amazon_sports/catalog.csv
    feature_source: categories
    bm25_text_source: normalized_text
  - name: ml1m
    display_name: ML-1M
    cohort_id: ml1m_primary_1000
    evaluation_users: 1000
    candidate_source: results/tables/plan_e_ml1m_1000user_ranking_manifest.csv
    cohort_filter_source: results/tables/canonical_llm_cohort_preflight.csv
    interaction_source: data/reconstructed/plan_c/ml1m/interactions.csv
    catalog_source: data/reconstructed/plan_c/ml1m/catalog.csv
    feature_source: categories
    bm25_text_source: normalized_text
  - name: lastfm
    display_name: LastFM
    cohort_id: lastfm_primary_1000
    evaluation_users: 1000
    candidate_source: data/processed/finalization_f6c_lastfm_ranking_candidates.csv
    cohort_filter_source: results/tables/phase_f6l_lastfm_operationalized_sample_cohort.csv
    interaction_source: data/processed/finalization_f6c_lastfm_train.csv
    catalog_source: data/processed/finalization_f6c_lastfm_catalog.csv
    feature_source: tag_values
    bm25_text_source: normalized_text
  - name: foodcom
    display_name: Food.com
    cohort_id: foodcom_primary_1000
    evaluation_users: 1000
    candidate_source: results/tables/d0a_foodcom_primary1000_candidates.csv
    cohort_filter_source: results/tables/d0a_foodcom_primary1000_users.csv
