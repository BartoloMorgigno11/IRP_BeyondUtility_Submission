    feature_source: RAW_recipes.tags
    bm25_text_source: RAW_recipes.tags

baselines:
  Random:
    seed: 42
    score_definition: sha256(seed,dataset,user_id,candidate_item_id)
    tie_breaking: descending_score_then_candidate_position_then_item_id
  MostPop:
    score_definition: train_split_only_item_frequency
    tie_breaking: descending_frequency_then_candidate_position_then_item_id
  BM25-like/content:
    k1: 1.5
    b: 0.75
    tie_breaking: descending_score_then_candidate_position_then_item_id
    foodcom_text_policy: RAW_recipes.tags

foodcom_tuning:
  frozen_search_space_source: results/tables/f1br_foodcom_search_space.csv
  frozen_contract_source: results/tables/f1br_foodcom_tuning_contract.csv
  tuning_seed: 42
  selection_metric: validation_ndcg_at_5
  tie_breaking: higher_validation_ndcg_at_5_then_lower_search_config_id_lexicographic
  validation_candidate_contract_required: true
  missing_validation_candidate_contract_status: BLOCKED_NOT_EXECUTED_MISSING_VALIDATION_CANDIDATE_CONTRACT
  protected_split_sources:
    train: data/raw/foodcom/d0a_extracted/e7a43e623c61/interactions_train.csv
    validation: data/raw/foodcom/d0a_extracted/e7a43e623c61/interactions_validation.csv
    test: data/raw/foodcom/d0a_extracted/e7a43e623c61/interactions_test.csv
